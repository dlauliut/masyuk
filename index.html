<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Masyuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      background: #000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    .screen {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
      background: #000;
    }

    .logo {
      position: relative;
      z-index: 1;
      display: block;
      width: min(72vw, 72vh, 760px);
      height: auto;
      opacity: .2;
      user-select: none;
      -webkit-user-drag: none;
      animation: signal 6s steps(1, end) infinite;
    }

    .glitch {
      position: absolute;
      z-index: 2;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background-repeat: no-repeat;
    }

    .glitch--upper {
      background-image: linear-gradient(
        to bottom,
        transparent 0 13%,
        rgba(255, 255, 255, .7) 13% 13.3%,
        rgba(0, 0, 0, .9) 13.3% 13.8%,
        transparent 13.8% 29%,
        rgba(255, 255, 255, .42) 29% 29.25%,
        rgba(0, 0, 0, .8) 29.25% 30%,
        transparent 30% 100%
      );
      animation: glitch-upper 6s steps(1, end) infinite;
    }

    .glitch--lower {
      background-image: linear-gradient(
        to bottom,
        transparent 0 61%,
        rgba(0, 0, 0, .92) 61% 61.7%,
        rgba(255, 255, 255, .62) 61.7% 62%,
        transparent 62% 78%,
        rgba(255, 255, 255, .38) 78% 78.25%,
        rgba(0, 0, 0, .86) 78.25% 79%,
        transparent 79% 100%
      );
      animation: glitch-lower 6s steps(1, end) infinite;
    }

    .message {
      position: absolute;
      z-index: 6;
      margin: 0;
      padding: .18em .3em;
      color: #fff;
      font-family: "Orbitron", "Bahnschrift", "Arial Narrow", sans-serif;
      font-size: clamp(1.35rem, 4.5vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: .1em;
      text-align: center;
      text-transform: uppercase;
      -webkit-text-stroke: 1px rgba(255, 255, 255, .75);
      text-shadow:
        2px 2px 0 #000,
        4px 4px 0 rgba(255, 255, 255, .38),
        0 0 18px rgba(255, 255, 255, .28);
      transform: skewX(-5deg);
      animation: text-flicker 6s steps(1, end) infinite;
    }

    .scanlines,
    .noise,
    .tear {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scanlines {
      z-index: 3;
      opacity: .09;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(255, 255, 255, .16) 4px
      );
    }

    .noise {
      z-index: 4;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      animation: noise-shift .22s steps(2, end) infinite;
    }

    .tear {
      z-index: 5;
      opacity: 0;
      background: linear-gradient(
        to bottom,
        transparent 0 18%,
        rgba(255, 255, 255, .75) 18% 18.2%,
        rgba(0, 0, 0, .9) 18.2% 19.1%,
        transparent 19.1% 64%,
        rgba(255, 255, 255, .55) 64% 64.15%,
        rgba(0, 0, 0, .9) 64.15% 65%,
        transparent 65% 100%
      );
      animation: screen-tear 6s steps(1, end) infinite;
    }

    @keyframes signal {
      0%, 8%, 10%, 48%, 49%, 100% { transform: translate(0); opacity: .2; }
      9% { transform: translate(-2px, 1px) skewX(-.5deg); opacity: .3; }
      48.5% { transform: translate(1px, 0); opacity: .34; }
    }

    @keyframes glitch-upper {
      0%, 8.4%, 10%, 48%, 49%, 100% { opacity: 0; transform: translateX(0); }
      8.5% { opacity: .72; transform: translateX(8px); }
      8.8% { opacity: .48; transform: translateX(-11px); }
      9.2% { opacity: .64; transform: translateX(4px); }
      48.2% { opacity: .52; transform: translateX(-9px); }
      48.6% { opacity: .7; transform: translateX(12px); }
    }

    @keyframes glitch-lower {
      0%, 8.4%, 10%, 48%, 49%, 100% { opacity: 0; transform: translateX(0); }
      8.6% { opacity: .62; transform: translateX(-7px); }
      9% { opacity: .46; transform: translateX(10px); }
      9.4% { opacity: .7; transform: translateX(-3px); }
      48.3% { opacity: .6; transform: translateX(11px); }
      48.7% { opacity: .5; transform: translateX(-8px); }
    }

    @keyframes screen-tear {
      0%, 8.4%, 10%, 48%, 49%, 100% { opacity: 0; transform: translateX(0); }
      8.5% { opacity: .16; transform: translateX(3px); }
      8.8% { opacity: .1; transform: translateX(-5px); }
      48.2% { opacity: .15; transform: translateX(-4px); }
      48.6% { opacity: .09; transform: translateX(6px); }
    }

    @keyframes text-flicker {
      0%, 8%, 10%, 48%, 49%, 100% { opacity: 1; transform: translate(0); }
      8.5% { opacity: .75; transform: translate(-2px, 0); }
      9% { opacity: .92; transform: translate(2px, 0); }
      48.4% { opacity: .72; transform: translate(1px, 0); }
    }

    @keyframes noise-shift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(1%, -1%); }
      50% { transform: translate(-1%, 1%); }
      75% { transform: translate(1%, 1%); }
      100% { transform: translate(-1%, -1%); }
    }

    @media (max-width: 520px) {
      .logo {
        width: min(88vw, 72vh);
      }

      .message {
        letter-spacing: .06em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo,
      .glitch,
      .tear,
      .noise,
      .message {
        animation: none;
      }

      .glitch,
      .tear {
        opacity: 0;
      }

      .noise {
        opacity: .02;
      }
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Masyuk">
    <img class="logo" src="images/masyuk.png" alt="Logo Masyuk">
    <div class="glitch glitch--upper" aria-hidden="true"></div>
    <div class="glitch glitch--lower" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>
    <div class="tear" aria-hidden="true"></div>
    <h1 class="message">Masyuk is coming</h1>
  </main>
</body>
</html>
